# 电商渠道规格表（可编辑配置，随 App 打包只读；用户副本放 Application Support）
# 范围：S2-5 先只做抖音；其余 4 平台（淘宝/天猫/京东/拼多多）暂缓，后续按平台规范回填。

channels:
  - id: douyin
    name: 抖音电商
    specs:
      - id: product_main
        name: 商品主图
        ratio: "1:1"
        width: 1000
        height: 1000
        min_width: 800        # 最低 800×800
        min_height: 800
        format: jpg
        suffix: _douyin_product_main
        constraints: "首图纯白底、无文字/logo/水印"
      - id: scene_main
        name: 场景主图
        ratio: "1:1"
        width: 1000
        height: 1000
        format: jpg
        suffix: _douyin_scene_main
      - id: detail
        name: 详情页
        ratio: "3:4"
        width: 750
        height: 1000
        format: jpg
        suffix: _douyin_detail
        unit: "屏"
        min_count: 3          # 3–5 屏
        max_count: 5
      - id: product_card
        name: 商品卡
        ratio: "1:1"
        width: 800
        height: 800
        format: jpg
        suffix: _douyin_card
